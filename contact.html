<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — PALRAM AI</title>
<meta name="description" content="Contact PALRAM AI at contact@palramai.in">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-theme="dark" data-page="contact">
<main>
  <section class="hero page-hero">
    <div class="wrap">
      <div class="hero-inner">
        <div class="eyebrow"><span class="dot"></span> Contact</div>
        <h1>Start a <span class="grad-text">project</span></h1>
        <p class="lead contact-note"><a href="mailto:contact@palramai.in">contact@palramai.in</a></p>
      </div>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <div class="contact-layout">
        <form class="card contact-form" onsubmit="submitInquiry(event)">
          <div>
            <label class="field-label" for="name">Name</label>
            <input class="field" id="name" name="name" required autocomplete="name">
          </div>
          <div>
            <label class="field-label" for="email">Email</label>
            <input class="field" id="email" name="email" type="email" required autocomplete="email">
          </div>
          <div>
            <label class="field-label" for="details">Message</label>
            <textarea class="field" id="details" name="details" rows="4" required></textarea>
          </div>
          <input type="hidden" name="company" value="">
          <input type="hidden" name="phone" value="">
          <input type="hidden" name="service" value="">
          <input type="hidden" name="budget" value="">
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/script.js"></script>
</body>
</html>
