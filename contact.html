<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — PALRAM AI</title>
<meta name="description" content="Contact PALRAM AI at contact@palramai.in">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-theme="dark" data-page="contact">
<main>
  <section class="hero page-hero">
    <div class="wrap">
      <div class="hero-inner">
        <div class="eyebrow"><span class="dot"></span> Contact</div>
        <h1>Tell us what to <span class="grad-text">build</span></h1>
        <p class="lead">Submit opens a draft to <strong>contact@palramai.in</strong>. You can write that address directly.</p>
      </div>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <div class="contact-layout">
        <aside class="contact-aside">
          <div class="card">
            <h3>Email</h3>
            <p><a href="mailto:contact@palramai.in">contact@palramai.in</a></p>
          </div>
          <div class="card">
            <h3>Site</h3>
            <p><a href="https://palramai.in">palramai.in</a></p>
          </div>
          <div class="card">
            <h3>Call</h3>
            <p>A short scoping call after we read your brief.</p>
          </div>
        </aside>
        <form class="card" onsubmit="submitInquiry(event)">
          <div class="form-grid">
            <div>
              <label class="field-label" for="name">Name *</label>
              <input class="field" id="name" name="name" required autocomplete="name">
            </div>
            <div>
              <label class="field-label" for="company">Company</label>
              <input class="field" id="company" name="company" autocomplete="organization">
            </div>
          </div>
          <div class="form-grid">
            <div>
              <label class="field-label" for="email">Work email *</label>
              <input class="field" id="email" name="email" type="email" required autocomplete="email">
            </div>
            <div>
              <label class="field-label" for="phone">Phone</label>
              <input class="field" id="phone" name="phone" type="tel" autocomplete="tel">
            </div>
          </div>
          <div class="form-grid">
            <div>
              <label class="field-label" for="service">Project type</label>
              <select class="field" id="service" name="service">
                <option>AI development</option>
                <option>AI agents</option>
                <option>Automation</option>
                <option>Web development</option>
                <option>Mobile apps</option>
                <option>UI / UX</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="budget">Budget (INR)</label>
              <select class="field" id="budget" name="budget">
                <option>Under ₹50,000</option>
                <option>₹50,000 – ₹1,50,000</option>
                <option>₹1,50,000 – ₹5,00,000</option>
                <option>₹5,00,000+</option>
                <option>Not sure yet</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <label class="field-label" for="details">What you want to build</label>
            <textarea class="field" id="details" name="details" rows="5"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Open email draft</button>
        </form>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/script.js"></script>
</body>
</html>
